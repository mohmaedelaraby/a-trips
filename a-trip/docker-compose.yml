# Full A Trip stack: Postgres + NestJS API + Next.js web.
#
#   docker compose up -d --build     start everything (migrations run first)
#   docker compose --profile seed run --rm seed   load demo + admin data
#   docker compose down              stop
#   docker compose down -v           stop and delete the database volume
#
# Every value has a working default, so the stack starts with no .env file.
# Override anything by copying .env.example to .env.

name: a-trip

# Containers marked `restart: unless-stopped` run until told otherwise, and
# Docker's default json-file driver never truncates — an API logging every
# request will fill the host disk given long enough. Capped and rotated.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  postgres:
    image: postgres:16-alpine
    container_name: a-trip-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-atrip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atrip}
      POSTGRES_DB: ${POSTGRES_DB:-atrip}
      # Pinned, not incidental. Prisma stores DateTime as `timestamp` (no zone)
      # holding UTC wall-clock, while NOW() is a `timestamptz` Postgres renders
      # in the server's zone. When those disagreed, every live payment hold
      # looked long expired and two guests could book the same last room. The
      # query fixed it with `NOW() AT TIME ZONE 'UTC'`; this makes the container
      # agree too, so the two can never drift apart again.
      TZ: UTC
      PGTZ: UTC
    ports:
      # Published on 5439 so it cannot collide with a Postgres already running
      # on the host's default 5432 (or the 5433 instance used for local dev).
      - '${POSTGRES_PORT:-5439}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    logging: *default-logging
    healthcheck:
      # Dependents wait on this, so the API never starts against a socket that
      # is listening but not yet accepting queries.
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-atrip} -d ${POSTGRES_DB:-atrip}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # S3-compatible object storage for hotel photos uploaded from the admin
  # portal. Console (browsable UI) is on 9001.
  minio:
    image: minio/minio:latest
    container_name: a-trip-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      # 9000 must be reachable from the host: <img> tags load photos directly.
      - '${S3_PORT:-9000}:9000'
      - '${S3_CONSOLE_PORT:-9001}:9001'
    volumes:
      - miniodata:/data
    logging: *default-logging
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s

  # One-shot job: applies pending migrations, then exits. The API waits for it
  # to complete successfully, so the schema is never behind the running code.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrate
    image: a-trip/migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-atrip}:${POSTGRES_PASSWORD:-atrip}@postgres:5432/${POSTGRES_DB:-atrip}
    restart: 'no'

  # Optional: demo hotels plus the admin-portal fixtures — staff accounts, the
  # amenity catalogue and header/footer navigation (both in English and Arabic),
  # room units, and 90 days of availability. Not part of `up` — run it
  # explicitly, or start the whole stack seeded with:
  #
  #   docker compose --profile seed up -d --wait
  #
  # Re-runnable. Hotels and bookings are rebuilt from scratch, while the amenity
  # catalogue, nav links and site settings are upserted and their translations
  # are only ever filled in, never overwritten — so wording edited in the admin
  # portal survives a re-seed.
  seed:
    profiles: ['seed']
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrate
    image: a-trip/migrate
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-atrip}:${POSTGRES_PASSWORD:-atrip}@postgres:5432/${POSTGRES_DB:-atrip}
    command: sh -c "pnpm exec tsx prisma/seed.ts && pnpm exec tsx prisma/seed-admin.ts"
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    image: a-trip/api
    container_name: a-trip-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      # `postgres` is the compose service name, resolved on the internal network.
      DATABASE_URL: postgresql://${POSTGRES_USER:-atrip}:${POSTGRES_PASSWORD:-atrip}@postgres:5432/${POSTGRES_DB:-atrip}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      PORT: 4000
      # Browser origin, so it must be the host-visible URL of the web app.
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      # Marks the two session cookies (see session-cookie.ts) Secure, which
      # only HTTPS will actually deliver to the browser. Stays false for this
      # default localhost-over-http stack; flip to true once the API sits
      # behind HTTPS (a reverse proxy, a load balancer) or logins will silently
      # fail to persist.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Internal address the API writes through...
      S3_ENDPOINT: http://minio:9000
      # ...and the host address baked into the returned image URLs, which the
      # browser must be able to resolve. These differ inside Docker.
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-http://localhost:9000}
      S3_BUCKET: ${S3_BUCKET:-atrip-uploads}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      # Ignored by MinIO, but the SDK sends it and real S3 rejects a mismatch,
      # so it is a knob you need the day you point S3_ENDPOINT at AWS.
      S3_REGION: ${S3_REGION:-us-east-1}
      # Checkout takes payment through PayPal before a booking reaches staff.
      # Left empty the API still boots: /api/payments/config reports
      # configured:false and the checkout says so instead of failing on click.
      # The secret is server-side only and never reaches the browser.
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_ENV: ${PAYPAL_ENV:-sandbox}
      PAYPAL_CURRENCY: ${PAYPAL_CURRENCY:-USD}
      # Tax rate used to split a tax-inclusive total for display.
      PRICING_TAX_RATE: ${PRICING_TAX_RATE:-0.1}
      # Same reason as on postgres: hold expiry is compared in UTC, so the API
      # must not be reasoning about "now" in a different zone from the database.
      TZ: UTC
    ports:
      - '${API_PORT:-4000}:4000'
    # Nest closes its Prisma pool on SIGTERM; give in-flight bookings — which
    # hold row locks — time to commit rather than being cut mid-transaction.
    stop_grace_period: 30s
    logging: *default-logging
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:4000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runtime
      args:
        # Baked into the client bundle at build time. This runs in the user's
        # browser, so it must be reachable from the host — not `http://api`.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}
    image: a-trip/web
    container_name: a-trip-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}
      # Server-side fetches (the root layout prefetches the footer links) run
      # inside the container, where `localhost` is the web container itself.
      # They go over the compose network instead.
      INTERNAL_API_URL: http://api:4000/api
      PORT: 3000
      TZ: UTC
    ports:
      - '${WEB_PORT:-3000}:3000'
    logging: *default-logging
    healthcheck:
      # The standalone server answers / once Next has finished booting, so this
      # is what `docker compose up --wait` and any orchestrator gate on.
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:3000/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  pgdata:
  miniodata:
